---
- name: Import RabbitMQ signing key
  ansible.builtin.rpm_key:
    state: present
    key: https://github.com/rabbitmq/signing-keys/releases/download/2.0/rabbitmq-release-signing-key.asc

- name: Import Erlang signing key
  ansible.builtin.rpm_key:
    state: present
    key: https://packagecloud.io/rabbitmq/erlang/gpgkey

- name: Create Erlang repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/rabbitmq-erlang.repo
    mode: "0644"
    content: |
      [rabbitmq_erlang]
      name=rabbitmq_erlang
      baseurl=https://packagecloud.io/rabbitmq/erlang/el/7/$basearch
      repo_gpgcheck=1
      gpgcheck=1
      enabled=1
      gpgkey=https://packagecloud.io/rabbitmq/erlang/gpgkey
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt

- name: Create RabbitMQ repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/rabbitmq.repo
    mode: "0644"
    content: |
      [rabbitmq_server]
      name=rabbitmq_server
      baseurl=https://packagecloud.io/rabbitmq/rabbitmq-server/el/7/$basearch
      repo_gpgcheck=1
      gpgcheck=1
      enabled=1
      gpgkey=https://packagecloud.io/rabbitmq/rabbitmq-server/gpgkey
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt

- name: Install RabbitMQ and dependencies
  ansible.builtin.yum:
    name:
      - socat
      - logrotate
      - rabbitmq-server
    state: present

- name: Start and enable RabbitMQ
  ansible.builtin.systemd:
    name: rabbitmq-server
    state: started
    enabled: true

- name: Remove the default guest account
  ansible.builtin.command: rabbitmqctl delete_user guest
  register: rabbitmq_delete_guest
  changed_when: rabbitmq_delete_guest.rc == 0
  failed_when: rabbitmq_delete_guest.rc != 0 and 'no such user' not in (rabbitmq_delete_guest.stderr | lower)

- name: Ensure the application user exists without the administrator tag
  ansible.builtin.shell: |
    set -euo pipefail
    if rabbitmqctl list_users | awk '{print $1}' | grep -qx '{{ rabbitmq_user }}'; then
      rabbitmqctl change_password '{{ rabbitmq_user }}' '{{ rabbitmq_password }}'
    else
      rabbitmqctl add_user '{{ rabbitmq_user }}' '{{ rabbitmq_password }}'
    fi
    rabbitmqctl set_user_tags '{{ rabbitmq_user }}' management
    rabbitmqctl set_permissions -p / '{{ rabbitmq_user }}' '.*' '.*' '.*'
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true
