---
- name: Download the NodeSource setup script
  ansible.builtin.get_url:
    url: https://rpm.nodesource.com/setup_16.x
    dest: /tmp/nodesource-setup.sh
    mode: "0755"

- name: Configure the NodeSource repository
  ansible.builtin.command: /tmp/nodesource-setup.sh
  args:
    creates: /etc/yum.repos.d/nodesource-el7.repo
  changed_when: true

- name: Install Node.js 16
  ansible.builtin.yum:
    name: nodejs
    state: present

- name: Create roboshop user
  user:
    name: roboshop
    comment: "RoboShop Application User"
    create_home: yes

- name: Create app directory
  file:
    path: /app
    state: directory
    owner: roboshop
    group: roboshop

- name: Download cart artifact
  get_url:
    url: "{{ cart_url }}"
    dest: /tmp/cart.zip
    mode: '0644'

- name: Extract cart artifact
  unarchive:
    src: /tmp/cart.zip
    dest: /app
    remote_src: yes
    owner: roboshop
    group: roboshop

- name: Install npm dependencies
  ansible.builtin.command: npm install
  args:
    chdir: /app
  become: true
  become_user: roboshop
  changed_when: true

- name: Create cart systemd service
  copy:
    dest: /etc/systemd/system/cart.service
    content: |
      [Unit]
      Description=Cart Service
      [Service]
      User=roboshop
      Environment=REDIS_HOST=redis.{{ private_domain }}
      Environment=CATALOGUE_HOST=catalogue.{{ private_domain }}
      Environment=CATALOGUE_PORT=8080
      ExecStart=/bin/node /app/server.js
      SyslogIdentifier=cart
      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Start and enable cart
  systemd:
    name: cart
    state: started
    enabled: yes
