---
extends: default

ignore: |
  .git/
  .terraform/
  terraform/.terraform/

rules:
  comments-indentation: false
  line-length: disable
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
